name: anchor-bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, swe-lite, swe-pro, terminal-bench]
      models:
        description: Comma-separated OpenRouter model ids
        type: string
        default: deepseek/deepseek-v4.1-flash-1017,qwen/qwen3-coder-next
      sdk_ref:
        description: Git ref/SHA to benchmark (blank = the workflow ref)
        type: string
        default: ""
      variants:
        description: Comma-separated harness variants
        type: string
        default: baseline,progress
      reasoning:
        description: Reasoning effort
        type: choice
        default: high
        options: [low, medium, high, xhigh, max]
      max_steps:
        description: Max agent steps per task
        type: string
        default: "300"
      max_usd:
        description: Max USD per task
        type: string
        default: "8"
      time_budget:
        description: Agent seconds per task (blank = task default)
        type: string
        default: ""
      tasks:
        description: Optional comma-separated task ids (smoke runs)
        type: string
        default: ""
      pro_shards:
        description: Shards for SWE-bench Pro (10 tasks split across shards)
        type: string
        default: "5"
      terminal_shards:
        description: Shards for Terminal-Bench (10 tasks split across shards)
        type: string
        default: "5"

  workflow_call:
    inputs:
      bench:
        type: string
        default: all
      models:
        type: string
        default: deepseek/deepseek-v4.1-flash-1017,qwen/qwen3-coder-next
      sdk_ref:
        type: string
        default: ""
      variants:
        type: string
        default: baseline,progress
      reasoning:
        type: string
        default: high
      max_steps:
        type: string
        default: "300"
      max_usd:
        type: string
        default: "8"
      time_budget:
        type: string
        default: ""
      tasks:
        type: string
        default: ""
      pro_shards:
        type: string
        default: "5"
      terminal_shards:
        type: string
        default: "5"

permissions:
  contents: write

env:
  LLM_BASE_URL: https://openrouter.ai/api/v1
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  OUT_ROOT: bench-runs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          BENCH: ${{ inputs.bench }}
          MODELS: ${{ inputs.models }}
          VARIANTS: ${{ inputs.variants }}
          PRO_SHARDS: ${{ inputs.pro_shards }}
          TERMINAL_SHARDS: ${{ inputs.terminal_shards }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { BENCH, MODELS, VARIANTS, PRO_SHARDS, TERMINAL_SHARDS } = process.env;
          const benches = BENCH === "all" ? ["swe-lite", "swe-pro", "terminal-bench"] : [BENCH];
          const shardsFor = (bench) => bench === "swe-pro" ? Number(PRO_SHARDS) : bench === "terminal-bench" ? Number(TERMINAL_SHARDS) : 1;
          const include = [];
          for (const bench of benches) {
            const shards = shardsFor(bench);
            for (const model of MODELS.split(",").map((s) => s.trim()).filter(Boolean)) {
              for (const variant of VARIANTS.split(",").map((s) => s.trim()).filter(Boolean)) {
                for (let shard = 0; shard < shards; shard++) {
                  include.push({ bench, model, variant, shard: String(shard), shards: String(shards) });
                }
              }
            }
          }
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE

  bench:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      BENCH: ${{ matrix.bench }}
      MODEL: ${{ matrix.model }}
      VARIANT: ${{ matrix.variant }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      REASONING: ${{ inputs.reasoning }}
      MAX_STEPS: ${{ inputs.max_steps }}
      MAX_USD: ${{ inputs.max_usd }}
      MAX_TOKENS: "50000000"
      TIME_BUDGET: ${{ inputs.time_budget }}
      TASKS: ${{ inputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sdk_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version metadata
        run: |
          echo "SDK_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install
        run: |
          npm ci
          npm ci --prefix evals
          npm run build
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
      - name: Run ${{ matrix.bench }} ${{ matrix.model }} ${{ matrix.variant }} shard ${{ matrix.shard }}
        run: bash evals/scripts/run-bench.sh
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ strategy.job-index }}
          path: evals/bench-runs
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: .bench-results
          merge-multiple: true
      - name: Aggregate
        run: node evals/scripts/aggregate-bench.mjs .bench-results .bench-results
      - name: Publish to bench-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -R evals/dashboard /tmp/anchor-dashboard
          git config user.name "anchor-bench"
          git config user.email "bench@anchor.local"
          git fetch origin bench-results || true
          if git rev-parse --verify origin/bench-results >/dev/null 2>&1; then
            git checkout -B bench-results origin/bench-results
          else
            git checkout --orphan bench-results
            git rm -rf . --quiet || true
          fi
          mkdir -p latest "runs/$GITHUB_RUN_ID"
          cp .bench-results/summary.json latest/
          cp .bench-results/summary.md latest/
          cp .bench-results/summary.json "runs/$GITHUB_RUN_ID/"
          cp .bench-results/summary.md "runs/$GITHUB_RUN_ID/"
          mkdir -p dashboard
          cp -R /tmp/anchor-dashboard/. dashboard/
          git add latest runs dashboard
          git commit -m "bench: run $GITHUB_RUN_ID" || true
          git push origin HEAD:bench-results
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: |
            .bench-results/summary.json
            .bench-results/summary.md
          retention-days: 90
