name: run-all-bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, swe-lite, swe-pro, terminal-bench]
      models:
        description: Comma-separated OpenRouter model ids
        type: string
        default: deepseek/deepseek-v4.1-flash-1017,qwen/qwen3-coder-next
      variants:
        description: Anchor variants (baseline,progress)
        type: string
        default: baseline
      reasoning:
        description: Reasoning effort for Anchor
        type: choice
        default: high
        options: [low, medium, high, xhigh, max]
      max_usd:
        description: Max USD per Anchor task
        type: string
        default: "3"
      pro_shards:
        description: Shards for SWE-bench Pro
        type: string
        default: "5"
      terminal_shards:
        description: Shards for Terminal-Bench
        type: string
        default: "5"
      tasks:
        description: Optional comma-separated task ids (smoke runs)
        type: string
        default: ""

permissions:
  contents: write

jobs:
  anchor:
    uses: ./.github/workflows/anchor-bench.yml
    secrets: inherit
    with:
      bench: ${{ inputs.bench }}
      models: ${{ inputs.models }}
      variants: ${{ inputs.variants }}
      reasoning: ${{ inputs.reasoning }}
      max_usd: ${{ inputs.max_usd }}
      pro_shards: ${{ inputs.pro_shards }}
      terminal_shards: ${{ inputs.terminal_shards }}
      tasks: ${{ inputs.tasks }}

  external:
    uses: ./.github/workflows/external-bench.yml
    secrets: inherit
    with:
      bench: ${{ inputs.bench }}
      models: ${{ inputs.models }}
      pro_shards: ${{ inputs.pro_shards }}
      terminal_shards: ${{ inputs.terminal_shards }}
      tasks: ${{ inputs.tasks }}
