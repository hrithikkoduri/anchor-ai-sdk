name: external-bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, swe-lite, swe-pro, terminal-bench]
      models:
        description: Comma-separated OpenRouter model ids
        type: string
        default: deepseek/deepseek-v4.1-flash-1017,qwen/qwen3-coder-next
      sdk_ref:
        description: Git ref/SHA to benchmark (blank = the workflow ref)
        type: string
        default: ""
      agent:
        description: Harbor agent, or auto (SWE-agent for SWE, Terminus-2 for Terminal)
        type: string
        default: auto
      tasks:
        description: Optional comma-separated task ids (smoke runs)
        type: string
        default: ""
      pro_shards:
        description: Shards for SWE-bench Pro
        type: string
        default: "5"
      terminal_shards:
        description: Shards for Terminal-Bench
        type: string
        default: "5"
  workflow_call:
    inputs:
      bench:
        type: string
        default: all
      models:
        type: string
        default: deepseek/deepseek-v4.1-flash-1017,qwen/qwen3-coder-next
      sdk_ref:
        type: string
        default: ""
      agent:
        type: string
        default: auto
      tasks:
        type: string
        default: ""
      pro_shards:
        type: string
        default: "5"
      terminal_shards:
        type: string
        default: "5"

permissions:
  contents: write

env:
  OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
  OUT_ROOT: external-runs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          BENCH: ${{ inputs.bench }}
          MODELS: ${{ inputs.models }}
          AGENT: ${{ inputs.agent }}
          PRO_SHARDS: ${{ inputs.pro_shards }}
          TERMINAL_SHARDS: ${{ inputs.terminal_shards }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { BENCH, MODELS, AGENT, PRO_SHARDS, TERMINAL_SHARDS } = process.env;
          const benches = BENCH === "all" ? ["swe-lite", "swe-pro", "terminal-bench"] : [BENCH];
          const shardsFor = (bench) => bench === "swe-pro" ? Number(PRO_SHARDS) : bench === "terminal-bench" ? Number(TERMINAL_SHARDS) : 1;
          const include = [];
          for (const bench of benches) {
            const shards = shardsFor(bench);
            for (const model of MODELS.split(",").map((s) => s.trim()).filter(Boolean)) {
              const selectedAgent =
              AGENT && AGENT !== "auto"
                ? AGENT
                : bench === "terminal-bench"
                  ? "terminus-2"
                  : "swe-agent";
            for (let shard = 0; shard < shards; shard++) {
                include.push({ bench, model, agent: selectedAgent, shard: String(shard), shards: String(shards) });
              }
            }
          }
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE

  external:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      BENCH: ${{ matrix.bench }}
      MODEL: ${{ matrix.model }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      AGENT: ${{ matrix.agent }}
      TASKS: ${{ inputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sdk_ref || github.sha }}
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
      - name: Version metadata
        run: |
          echo "SDK_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select Python
        run: echo "PYTHON_BIN=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Install Harbor
        run: |
          PY="${PYTHON_BIN:-python}"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install harbor
          # Harbor 0.24's SWE-agent adapter has two bugs on these images:
          #   1. the /app fallback emits a literal $(pwd);
          #   2. it starts in the workspace, so Python 3.12 imports the old
          #      vendored requests package from /testbed.
          # Pin the repo path for /app tasks and start the agent from /.
          "$PY" - <<'PY'
          from pathlib import Path
          import harbor
          path = Path(harbor.__file__).parent / "agents/installed/swe_agent.py"
          text = path.read_text()
          text = text.replace(
              "echo '--env.repo.path=$(pwd)'",
              "echo '--env.repo.type=preexisting --env.repo.repo_name=/app'",
          )
          text = text.replace(
              'command = " ".join(cmd_parts)',
              'command = "cd / && " + " ".join(cmd_parts) + '
              '" --agent.model.per_instance_cost_limit=0 --agent.model.total_cost_limit=0"',
          )
          # SWE-agent's latest litellm imports mcp at runtime; Harbor's venv
          # install does not pull it, so the first model call dies before any
          # tokens are counted.
          text = text.replace(
              "uv pip install /opt/sweagent-repo && ",
              "uv pip install /opt/sweagent-repo && uv pip install mcp && ",
          )
          path.write_text(text)
          PY
          sudo apt-get update && sudo apt-get install -y tmux
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          docker system prune -af --volumes || true
      - name: Run external ${{ matrix.bench }} ${{ matrix.model }} shard ${{ matrix.shard }}
        run: bash evals/scripts/run-external-bench.sh
      - name: Upload external results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-${{ strategy.job-index }}
          path: evals/external-runs
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, external]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: external-results
          merge-multiple: true
      - name: Aggregate
        run: node evals/scripts/aggregate-external.mjs external-results external-results
      - name: Publish external results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "anchor-bench"
          git config user.email "bench@anchor.local"
          git fetch origin external-bench-results || true
          if git rev-parse --verify origin/external-bench-results >/dev/null 2>&1; then
            git checkout -B external-bench-results origin/external-bench-results
          else
            git checkout --orphan external-bench-results
            git rm -rf . --quiet || true
          fi
          mkdir -p latest "runs/$GITHUB_RUN_ID"
          cp .bench-results/summary.json latest/
          cp .bench-results/summary.md latest/
          cp .bench-results/summary.json "runs/$GITHUB_RUN_ID/"
          cp .bench-results/summary.md "runs/$GITHUB_RUN_ID/"
          git add latest runs
          git commit -m "external bench: run $GITHUB_RUN_ID" || true
          git push origin HEAD:external-bench-results
      - name: Upload external summary
        uses: actions/upload-artifact@v4
        with:
          name: external-summary
          path: |
            external-results/summary.json
            external-results/summary.md
          retention-days: 90
